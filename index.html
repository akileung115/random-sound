<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1530">
<title>隨機音效</title>
<style>
  :root {
    --bg: #1b1530;
    --bg2: #2a2148;
    --fg: #ffffff;
    --muted: rgba(255,255,255,.6);
    --accent: #ffc664;
    --accent2: #ff8a5c;
    --row: rgba(255,255,255,.06);
    --row-active: rgba(255,198,100,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 40%, var(--bg2), var(--bg) 70%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .page {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    transition: transform .3s ease, opacity .3s ease;
  }
  .page.hidden { opacity: 0; pointer-events: none; }
  #home.hidden { transform: translateX(-20%); }
  #list.hidden { transform: translateX(20%); }

  .topbar { height: 60px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 12px;
    background: rgba(255,255,255,.08); color: var(--fg);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: rgba(255,255,255,.18); }
  .icon-btn svg { width: 24px; height: 24px; }
  .title { font-size: 18px; font-weight: 600; }

  /* 主頁 */
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  #bigBtn {
    width: min(78vw, 78vh, 380px); aspect-ratio: 1; border-radius: 50%; border: 0;
    background: radial-gradient(circle at 35% 30%, #ffe3a6, var(--accent) 45%, var(--accent2));
    box-shadow: 0 18px 50px rgba(255,138,92,.45), inset 0 -10px 30px rgba(0,0,0,.15);
    color: #3a2410; font-size: clamp(28px, 9vw, 44px); font-weight: 800; letter-spacing: 2px;
    cursor: pointer; transition: transform .12s ease;
    display: grid; place-items: center;
  }
  #bigBtn:active { transform: scale(.94); }
  #bigBtn.playing { animation: pulse .6s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); box-shadow: 0 18px 70px rgba(255,198,100,.7); } }
  #nowPlaying { min-height: 24px; color: var(--muted); font-size: 16px; text-align: center; }

  /* 清單 */
  #items { list-style: none; margin: 8px 0 0; padding: 0 0 24px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  #items li {
    display: flex; align-items: center; gap: 14px;
    padding: 16px; margin-bottom: 10px; border-radius: 14px;
    background: var(--row); cursor: pointer;
  }
  #items li:active { background: rgba(255,255,255,.14); }
  #items li.active { background: var(--row-active); }
  .num {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); color: #3a2410; font-weight: 700;
    display: grid; place-items: center;
  }
  .name { flex: 1; font-size: 17px; }
  .dur { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<section id="home" class="page">
  <div class="topbar">
    <button class="icon-btn" id="openList" aria-label="音訊清單">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
  <div class="center">
    <button id="bigBtn">按我！</button>
    <div id="nowPlaying"></div>
  </div>
</section>

<section id="list" class="page hidden">
  <div class="topbar">
    <button class="icon-btn" id="back" aria-label="返回主頁">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="title">所有音訊</div>
  </div>
  <ul id="items"></ul>
</section>

const audio = new Audio();
audio.preload = 'auto';
let current = -1;

const bigBtn = document.getElementById('bigBtn');
const nowPlaying = document.getElementById('nowPlaying');
const items = document.getElementById('items');

function play(i) {
  current = i;
  audio.pause();
  audio.src = SOUNDS[i].src;
  audio.currentTime = 0;
  audio.play().catch(() => {});
  nowPlaying.textContent = '正在播放：' + SOUNDS[i].name;
  bigBtn.classList.add('playing');
  document.querySelectorAll('#items li').forEach((li, k) => li.classList.toggle('active', k === i));
}

audio.addEventListener('ended', () => {
  bigBtn.classList.remove('playing');
  document.querySelectorAll('#items li').forEach(li => li.classList.remove('active'));
});

bigBtn.addEventListener('click', () => {
  let i = Math.floor(Math.random() * SOUNDS.length);
  // 避免連續兩次播同一條
  if (SOUNDS.length > 1 && i === current) i = (i + 1 + Math.floor(Math.random() * (SOUNDS.length - 1))) % SOUNDS.length;
  play(i);
});

SOUNDS.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<div class="num">${i + 1}</div><div class="name"></div><div class="dur">${s.dur}</div>`;
  li.querySelector('.name').textContent = s.name;
  li.addEventListener('click', () => play(i));
  items.appendChild(li);
});

const home = document.getElementById('home');
const list = document.getElementById('list');
document.getElementById('openList').addEventListener('click', () => { home.classList.add('hidden'); list.classList.remove('hidden'); });
document.getElementById('back').addEventListener('click', () => { list.classList.add('hidden'); home.classList.remove('hidden'); });
</script>
